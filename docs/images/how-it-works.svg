<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 724" width="1000" height="724" role="img"
     aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How MacShack works</title>
  <desc id="d">Two apps work together. MacShack is the app you open: its own screens, Valve's Steam client in Big Picture,
    preparing and signing games, and the JIT helper. MacShack Play is where every game runs: Apple silicon Mac games
    natively on MacShack's macOS shims, Intel Mac games through AArchX on the same shims, and Windows games on Madeira
    (Wine, FEX and DXMT). Both sit on iOS and share game files, saves and settings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c3a"/><stop offset="1" stop-color="#0b1024"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c9d4f2"/>
    </marker>
    <marker id="s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#7f8db5"/>
    </marker>
  </defs>

  <rect width="1000" height="724" rx="22" fill="url(#bg)"/>

  <!-- Title -->
  <text x="28" y="46" font-size="25" font-weight="700" fill="#ffffff">How MacShack works</text>
  <text x="28" y="70" font-size="14.5" fill="#a9b6da">Two apps on your device. MacShack runs Steam; MacShack Play runs the game.</text>

  <!-- MacShack -->
  <rect x="28" y="92" width="340" height="380" rx="18" fill="#182449" stroke="#5b9bff" stroke-width="1.5"/>
  <circle cx="54" cy="119" r="7" fill="#5b9bff"/>
  <text x="70" y="126" font-size="20" font-weight="700" fill="#ffffff">MacShack</text>
  <text x="44" y="147" font-size="13.5" fill="#a9b6da">The app you open</text>
  <g font-size="13" fill="#b9c5e6">
    <rect x="44" y="160" width="308" height="62" rx="11" fill="#22315f"/>
    <text x="58" y="186" font-size="15" font-weight="600" fill="#ffffff">MacShack's screens</text>
    <text x="58" y="207">Home · Local Games · Settings</text>

    <rect x="44" y="232" width="308" height="62" rx="11" fill="#22315f" stroke="#5b9bff" stroke-opacity=".55"/>
    <text x="58" y="258" font-size="15" font-weight="600" fill="#ffffff">Steam Big Picture</text>
    <text x="58" y="279">Valve's Mac Steam client, on the macOS shims</text>

    <rect x="44" y="304" width="308" height="62" rx="11" fill="#22315f"/>
    <text x="58" y="330" font-size="15" font-weight="600" fill="#ffffff">Prepare and sign</text>
    <text x="58" y="351">Fits a Mac game's code to iOS, on the device</text>

    <rect x="44" y="376" width="308" height="62" rx="11" fill="#22315f"/>
    <text x="58" y="402" font-size="15" font-weight="600" fill="#ffffff">JIT helper</text>
    <text x="58" y="423">Unlocks games that make code as they run</text>
  </g>
  <text x="198" y="460" font-size="13" text-anchor="middle" fill="#8fb8ff">Keeps running behind your game</text>

  <!-- Between the apps -->
  <text x="419" y="218" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">Press Play</text>
  <line x1="376" y1="230" x2="462" y2="230" stroke="#c9d4f2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="462" y1="300" x2="376" y2="300" stroke="#c9d4f2" stroke-width="2" marker-end="url(#a)"/>
  <text x="419" y="321" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">Steam</text>
  <text x="419" y="338" font-size="12" text-anchor="middle" fill="#a9b6da">cloud saves,</text>
  <text x="419" y="354" font-size="12" text-anchor="middle" fill="#a9b6da">achievements</text>

  <!-- MacShack Play -->
  <rect x="470" y="92" width="502" height="380" rx="18" fill="#221a45" stroke="#b08cff" stroke-width="1.5"/>
  <circle cx="496" cy="119" r="7" fill="#b08cff"/>
  <text x="512" y="126" font-size="20" font-weight="700" fill="#ffffff">MacShack Play</text>
  <text x="486" y="147" font-size="13.5" fill="#a9b6da">Where every game runs</text>

  <!-- Kinds of game -->
  <g text-anchor="middle">
    <rect x="486" y="160" width="150" height="46" rx="23" fill="#143d2c" stroke="#4ade80"/>
    <text x="561" y="179" font-size="14" font-weight="600" fill="#ffffff">Mac game</text>
    <text x="561" y="196" font-size="12" fill="#86efac">Apple silicon</text>

    <rect x="646" y="160" width="150" height="46" rx="23" fill="#43330f" stroke="#fbbf24"/>
    <text x="721" y="179" font-size="14" font-weight="600" fill="#ffffff">Mac game</text>
    <text x="721" y="196" font-size="12" fill="#fcd34d">Intel</text>

    <rect x="806" y="160" width="150" height="46" rx="23" fill="#0f3550" stroke="#38bdf8"/>
    <text x="881" y="179" font-size="14" font-weight="600" fill="#ffffff">Windows game</text>
    <text x="881" y="196" font-size="12" fill="#7dd3fc">through Steam Play</text>
  </g>
  <g stroke="#7f8db5" stroke-width="1.5" marker-end="url(#s)">
    <line x1="561" y1="208" x2="561" y2="220"/><line x1="721" y1="208" x2="721" y2="220"/><line x1="881" y1="208" x2="881" y2="220"/>
    <line x1="561" y1="286" x2="561" y2="298"/><line x1="721" y1="286" x2="721" y2="298"/>
  </g>

  <!-- What runs it -->
  <g text-anchor="middle" font-size="12.5" fill="#b9c5e6">
    <rect x="486" y="222" width="150" height="62" rx="11" fill="#2f2660"/>
    <text x="561" y="248" font-size="15" font-weight="600" fill="#ffffff">Runs as it is</text>
    <text x="561" y="268">already ARM code</text>

    <rect x="646" y="222" width="150" height="62" rx="11" fill="#2f2660" stroke="#fbbf24" stroke-opacity=".6"/>
    <text x="721" y="248" font-size="15" font-weight="600" fill="#ffffff">AArchX</text>
    <text x="721" y="268">Intel code → ARM</text>

    <rect x="486" y="300" width="310" height="120" rx="11" fill="#22315f" stroke="#5b9bff" stroke-opacity=".55"/>
    <text x="641" y="325" font-size="15" font-weight="600" fill="#ffffff">macOS shims</text>
    <text x="641" y="345">Mac system pieces iOS lacks, rebuilt on iOS ones</text>
    <text x="641" y="371" fill="#dbe4fb">AppKit → UIKit&#160;&#160;&#160;·&#160;&#160;&#160;OpenGL → OpenGL ES</text>
    <text x="641" y="391" fill="#dbe4fb">Gamepads → GameController</text>
    <text x="641" y="411" fill="#dbe4fb">Core Audio → iOS audio</text>

    <rect x="806" y="222" width="150" height="198" rx="11" fill="#12283f" stroke="#38bdf8" stroke-opacity=".6"/>
    <text x="881" y="244" font-size="13" font-weight="600" fill="#7dd3fc">Madeira</text>
    <rect x="814" y="254" width="134" height="46" rx="9" fill="#1b3b5c"/>
    <text x="881" y="273" font-size="14" font-weight="600" fill="#ffffff">Wine</text>
    <text x="881" y="290" font-size="12">Windows calls → iOS</text>
    <rect x="814" y="306" width="134" height="46" rx="9" fill="#1b3b5c"/>
    <text x="881" y="325" font-size="14" font-weight="600" fill="#ffffff">FEX</text>
    <text x="881" y="342" font-size="12">Intel code → ARM</text>
    <rect x="814" y="358" width="134" height="46" rx="9" fill="#1b3b5c"/>
    <text x="881" y="377" font-size="14" font-weight="600" fill="#ffffff">DXMT</text>
    <text x="881" y="394" font-size="12">Direct3D → Metal</text>
  </g>
  <text x="721" y="460" font-size="13" text-anchor="middle" fill="#cdb8ff">A fresh start for each game, with iOS Game Mode</text>

  <!-- Shared, and iOS underneath -->
  <rect x="28" y="484" width="944" height="34" rx="10" fill="none" stroke="#7f8db5" stroke-dasharray="5 5"/>
  <text x="500" y="506" font-size="13.5" text-anchor="middle" fill="#c9d4f2">Shared by both apps: your game files, saves and settings</text>

  <rect x="28" y="530" width="944" height="44" rx="12" fill="#2a3763"/>
  <text x="500" y="558" font-size="15" text-anchor="middle" fill="#ffffff"><tspan font-weight="700">iOS and iPadOS&#160;&#160;&#160;</tspan><tspan fill="#b9c5e6">·&#160;&#160;&#160;Metal&#160;&#160;&#160;·&#160;&#160;&#160;UIKit&#160;&#160;&#160;·&#160;&#160;&#160;GameController&#160;&#160;&#160;·&#160;&#160;&#160;audio</tspan></text>

  <!-- Why two apps -->
  <rect x="28" y="592" width="944" height="108" rx="16" fill="#101733" stroke="#33406e"/>
  <circle cx="62" cy="646" r="17" fill="#2a3763"/>
  <text x="62" y="653" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
  <text x="96" y="621" font-size="16" font-weight="700" fill="#ffffff">Why two apps?</text>
  <g font-size="14" fill="#c2cdea">
    <text x="96" y="644">iOS gives an app one process, and no way to start another program.</text>
    <text x="96" y="664">So Steam lives in MacShack and keeps running, and each game starts fresh in MacShack Play,</text>
    <text x="96" y="684">where iOS gives it Game Mode. You can play one game after another without restarting Steam.</text>
  </g>
</svg>
